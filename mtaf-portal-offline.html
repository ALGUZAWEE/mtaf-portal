<style id="mtaf-modern-ui">
:root{
  --mtaf-ink:#102f2a;
  --mtaf-ink-2:#173f38;
  --mtaf-teal:#0f766e;
  --mtaf-teal-2:#149184;
  --mtaf-gold:#c9a227;
  --mtaf-cream:#f7f6f1;
  --mtaf-surface:#ffffff;
  --mtaf-muted:#66756f;
  --mtaf-line:#e6e9e5;
  --mtaf-danger:#b84a3b;
  --mtaf-shadow:0 10px 30px rgba(16,47,42,.07);
  --mtaf-shadow-sm:0 4px 16px rgba(16,47,42,.06);
}
html{background:var(--mtaf-cream);scroll-behavior:smooth}
body{background:var(--mtaf-cream)!important;color:var(--mtaf-ink)}
button,input,select,textarea{transition:background-color .18s ease,border-color .18s ease,box-shadow .18s ease,transform .18s ease}
button:hover:not(:disabled){transform:translateY(-1px)}
input:focus,select:focus,textarea:focus{outline:none!important;border-color:var(--mtaf-teal)!important;box-shadow:0 0 0 3px rgba(15,118,110,.10)!important}

/* Desktop app shell */
.mtaf-layout.max-w-6xl{max-width:1440px!important;width:100%}
header .max-w-6xl{max-width:1440px!important;width:100%}
.mtaf-sidebar{width:252px!important;background:linear-gradient(180deg,#102f2a 0%,#0c2925 100%)!important;padding:18px 12px!important;border-right:1px solid rgba(255,255,255,.07);box-shadow:8px 0 30px rgba(16,47,42,.06)}
.mtaf-sidebar button{border:1px solid transparent!important;color:#cbd8d4!important;border-radius:12px!important;padding:11px 12px!important}
.mtaf-sidebar button:hover{background:rgba(255,255,255,.07)!important;color:#fff!important}
.mtaf-sidebar button[style*="background: rgb(15, 118, 110)"],.mtaf-sidebar button[style*="background: #0f766e"]{box-shadow:0 6px 16px rgba(15,118,110,.25)}
.mtaf-main{background:var(--mtaf-cream);min-height:calc(100vh - 78px);padding-left:30px!important;padding-right:30px!important}

/* Header */
header{position:sticky!important;top:0;z-index:35;background:rgba(16,47,42,.96)!important;backdrop-filter:blur(14px);box-shadow:0 4px 18px rgba(16,47,42,.12)}
header .max-w-6xl{min-height:52px}
header h1{font-family:'Plus Jakarta Sans',Inter,system-ui,sans-serif!important;letter-spacing:-.02em}
header .w-11.h-11{border-radius:14px!important;box-shadow:0 4px 12px rgba(0,0,0,.12)}

/* Cards and content surfaces */
.rounded-xl.bg-white.p-4.mb-5,
.rounded-xl.bg-white.p-5.mb-5,
.rounded-xl.bg-white.p-6.mb-5,
.rounded-xl.bg-white.p-4,
.rounded-xl.bg-white.p-5,
.rounded-xl.bg-white.p-6{
  border:1px solid var(--mtaf-line)!important;
  border-radius:18px!important;
  box-shadow:var(--mtaf-shadow-sm)!important;
}
.rounded-xl.bg-white.p-4.mb-5:hover,
.rounded-xl.bg-white.p-5.mb-5,
.rounded-xl.bg-white.p-6.mb-5{ }

/* Tables */
table{width:100%;font-family:'Plus Jakarta Sans',Inter,system-ui,sans-serif}
thead th{font-size:11px!important;text-transform:uppercase;letter-spacing:.06em;color:#71817b!important;background:#f5f7f5!important;padding:11px 12px!important}
tbody td{padding:11px 12px!important;border-bottom:1px solid #edf0ed!important;font-size:13px!important}
tbody tr:hover{background:#f8faf8!important}

/* Form controls */
input,select,textarea{border-radius:11px!important;border:1px solid #dfe5e1!important;background:#fff!important;min-height:40px}
button.rounded-lg,button.rounded-xl{border-radius:11px!important}

/* Mobile bottom navigation */
.mtaf-bottomnav{background:rgba(16,47,42,.98)!important;backdrop-filter:blur(14px);box-shadow:0 -8px 25px rgba(16,47,42,.12);padding-bottom:env(safe-area-inset-bottom)!important}
.mtaf-bottomnav button{min-height:58px!important}
.mtaf-sheet-backdrop{background:rgba(10,27,24,.48)!important;backdrop-filter:blur(4px)}

/* Better module spacing */
.mtaf-main>div>div:first-child{max-width:100%}
.mtaf-main h2,.mtaf-main h3{letter-spacing:-.02em}

@media(max-width:899px){
  header{position:sticky!important;top:0}
  header .max-w-6xl{padding-left:14px!important;padding-right:14px!important}
  header .px-5,header .sm\\:px-8{padding-left:0!important;padding-right:0!important}
  header .w-11.h-11{width:40px!important;height:40px!important}
  header h1{font-size:15px!important}
  header p{font-size:10px!important}
  header .flex.items-center.gap-2>button:first-of-type{font-size:0!important;padding:8px!important;width:38px;height:34px}
  header .flex.items-center.gap-2>button:first-of-type:after{content:'⚙';font-size:15px}
  header .flex.items-center.gap-2>button:last-of-type{padding:8px 11px!important;font-size:11px!important}
  .mtaf-main{padding:16px 14px 78px!important;min-height:calc(100vh - 70px)}
  .mtaf-main>div{min-width:0}
  .rounded-xl.bg-white.p-4.mb-5,.rounded-xl.bg-white.p-5.mb-5,.rounded-xl.bg-white.p-6.mb-5{border-radius:16px!important;margin-bottom:13px!important;padding:14px!important}
  .grid-cols-2,.grid-cols-3{grid-template-columns:1fr!important}
  .overflow-x-auto{border-radius:12px}
  table{min-width:640px}
  .mtaf-sheet-backdrop>div{max-width:100vw!important}
}
@media(min-width:900px){
  .mtaf-bottomnav{display:none!important}
  .mtaf-main{padding-top:28px!important}
}
@media(min-width:1200px){
  .mtaf-sidebar{width:268px!important}
  .mtaf-main{padding-left:36px!important;padding-right:36px!important}
}
</style>
<style>

/* MTAF physical module-button system */
.mtaf-sheet-backdrop{align-items:flex-end!important;background:rgba(8,29,24,.55)!important;backdrop-filter:blur(8px)!important;padding:0!important}
.mtaf-module-sheet{width:100%;max-width:720px!important;max-height:90vh!important;overflow-y:auto!important;background:#f7f5ef!important;border-radius:30px 30px 0 0!important;padding:12px 18px calc(20px + env(safe-area-inset-bottom))!important;box-shadow:0 -22px 55px rgba(15,61,46,.28)!important}
.mtaf-sheet-handle{width:46px;height:5px;border-radius:999px;background:#c8d0cc;margin:0 auto 16px}
.mtaf-sheet-title{font-family:'Plus Jakarta Sans',Inter,system-ui,sans-serif!important;font-size:22px!important;font-weight:800!important;letter-spacing:-.025em}
.mtaf-sheet-close{width:44px;height:44px;border-radius:15px!important;background:#fff!important;border:1px solid #e2e7e4!important;color:#52615b!important;display:flex;align-items:center;justify-content:center;font-size:22px!important;box-shadow:0 4px 12px rgba(15,61,46,.08)!important}
.mtaf-sheet-subtitle{font-family:'Plus Jakarta Sans',Inter,system-ui,sans-serif;font-size:12px;color:#71817b;margin-top:3px}
.mtaf-module-search{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #dfe5e1;border-radius:17px;padding:0 14px;height:52px;box-shadow:0 4px 14px rgba(15,61,46,.05);margin-bottom:12px}
.mtaf-module-search:focus-within{border-color:#126b4f;box-shadow:0 0 0 4px rgba(18,107,79,.10)}
.mtaf-module-search .mtaf-search-icon{font-size:23px;color:#64736d;line-height:1}
.mtaf-module-search input{border:0!important;outline:0!important;box-shadow:none!important;background:transparent!important;min-height:44px!important;width:100%;font-size:14px!important;color:#1f2937!important}
.mtaf-module-search input::placeholder{color:#9aa6a1}
.mtaf-module-filters{display:flex;gap:8px;overflow-x:auto;padding:1px 1px 12px;scrollbar-width:none}
.mtaf-module-filters::-webkit-scrollbar{display:none}
.mtaf-filter-chip{flex:0 0 auto;border:1px solid #dfe6e2;background:#fff;color:#52615b;border-radius:999px;padding:9px 14px;font-family:'Plus Jakarta Sans',Inter,system-ui,sans-serif;font-size:11px;font-weight:700;white-space:nowrap;box-shadow:0 2px 7px rgba(15,61,46,.04)}
.mtaf-filter-chip.is-active{background:#0f3d2e;color:#fff;border-color:#0f3d2e;box-shadow:0 5px 12px rgba(15,61,46,.18)}
.mtaf-module-sections{display:flex;flex-direction:column;gap:16px}
.mtaf-module-section-title{font-family:'Plus Jakarta Sans',Inter,system-ui,sans-serif;font-size:11px;font-weight:850;letter-spacing:.10em;text-transform:uppercase;color:#124b3a;margin:1px 2px 9px}
.mtaf-module-grid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px!important}
.mtaf-module-card{position:relative!important;min-height:132px!important;height:132px!important;padding:14px 13px 13px!important;border-radius:22px!important;border:1px solid rgba(0,0,0,.12)!important;color:#fff!important;display:flex!important;flex-direction:column!important;align-items:flex-start!important;justify-content:flex-start!important;text-align:left!important;overflow:hidden!important;cursor:pointer!important;box-shadow:0 9px 0 rgba(0,0,0,.18),0 14px 23px rgba(15,61,46,.16),inset 0 1px 0 rgba(255,255,255,.28)!important;transition:transform .12s ease,box-shadow .12s ease,filter .12s ease!important}
.mtaf-module-card:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.18),transparent 38%,rgba(0,0,0,.08));pointer-events:none}
.mtaf-module-card:hover{transform:translateY(-3px)!important;filter:saturate(1.06)!important;box-shadow:0 12px 0 rgba(0,0,0,.18),0 18px 27px rgba(15,61,46,.18),inset 0 1px 0 rgba(255,255,255,.30)!important}
.mtaf-module-card:active{transform:translateY(5px)!important;box-shadow:0 3px 0 rgba(0,0,0,.20),0 7px 12px rgba(15,61,46,.12),inset 0 2px 5px rgba(0,0,0,.12)!important}
.mtaf-module-card.is-active{filter:saturate(1.08) brightness(1.02)!important;outline:3px solid rgba(212,175,55,.55)!important;outline-offset:1px!important}
.mtaf-module-icon{position:relative;z-index:1;width:46px!important;height:46px!important;min-width:46px!important;border-radius:15px!important;background:rgba(255,255,255,.93)!important;display:flex!important;align-items:center!important;justify-content:center!important;color:var(--module-dark,#0f3d2e)!important;margin:0 0 10px!important;box-shadow:0 4px 8px rgba(0,0,0,.13),inset 0 1px 0 rgba(255,255,255,.9)!important}
.mtaf-module-label{position:relative;z-index:1;font-family:'Plus Jakarta Sans',Inter,system-ui,sans-serif;font-size:13.5px!important;font-weight:800!important;line-height:1.18!important;letter-spacing:-.01em!important;color:#fff!important;padding-right:25px!important;max-width:100%!important;overflow-wrap:anywhere!important}
.mtaf-module-help{position:relative;z-index:1;font-family:'Plus Jakarta Sans',Inter,system-ui,sans-serif;font-size:10.5px!important;line-height:1.35!important;color:rgba(255,255,255,.88)!important;margin-top:5px!important;padding-right:19px!important;max-width:100%!important;overflow-wrap:anywhere!important}
.mtaf-module-arrow{position:absolute;z-index:2;right:10px;bottom:10px;width:29px;height:29px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:19px;font-weight:700;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.mtaf-module-lock{position:absolute;z-index:3;right:11px;top:10px;font-size:11px;background:rgba(0,0,0,.20);border-radius:999px;padding:3px 5px}
/* Category palettes: related colours, with enough variation to make modules visually distinct. */
.mtaf-module-card.cat-main:nth-child(1){--module-dark:#0b4b39;background:linear-gradient(145deg,#087a58,#0f5d45)}
.mtaf-module-card.cat-main:nth-child(2){--module-dark:#08715f;background:linear-gradient(145deg,#18a58a,#087b67)}
.mtaf-module-card.cat-main:nth-child(3){--module-dark:#124c9a;background:linear-gradient(145deg,#2375df,#0750b8)}
.mtaf-module-card.cat-school:nth-child(3n+1){--module-dark:#124c9a;background:linear-gradient(145deg,#2779e7,#0750b8)}
.mtaf-module-card.cat-school:nth-child(3n+2){--module-dark:#2d5e0d;background:linear-gradient(145deg,#79b833,#4b8b16)}
.mtaf-module-card.cat-school:nth-child(3n){--module-dark:#5a1a8e;background:linear-gradient(145deg,#9a4bd0,#63228e)}
.mtaf-module-card.cat-finance:nth-child(3n+1){--module-dark:#a53f00;background:linear-gradient(145deg,#ff8a18,#ed5a00)}
.mtaf-module-card.cat-finance:nth-child(3n+2){--module-dark:#9a6b00;background:linear-gradient(145deg,#f3bf25,#d99a00)}
.mtaf-module-card.cat-finance:nth-child(3n){--module-dark:#5b2490;background:linear-gradient(145deg,#9a4bd0,#64248e)}
.mtaf-module-card.cat-communication:nth-child(3n+1){--module-dark:#5c208b;background:linear-gradient(145deg,#a44bd4,#70259d)}
.mtaf-module-card.cat-communication:nth-child(3n+2){--module-dark:#124c9a;background:linear-gradient(145deg,#2779e7,#0750b8)}
.mtaf-module-card.cat-communication:nth-child(3n){--module-dark:#08715f;background:linear-gradient(145deg,#22aaa1,#087c73)}
.mtaf-module-card.cat-administration:nth-child(3n+1){--module-dark:#9f1420;background:linear-gradient(145deg,#f0444c,#d81f2a)}
.mtaf-module-card.cat-administration:nth-child(3n+2){--module-dark:#124c9a;background:linear-gradient(145deg,#2779e7,#0750b8)}
.mtaf-module-card.cat-administration:nth-child(3n){--module-dark:#34404a;background:linear-gradient(145deg,#7c8791,#4e5a64)}
.mtaf-module-card.cat-family{--module-dark:#a97900;background:linear-gradient(145deg,#e7b72b,#c99200)}
.mtaf-module-card.cat-student{--module-dark:#08715f;background:linear-gradient(145deg,#25a9c0,#087e91)}
.mtaf-empty-modules{background:#fff;border:1px dashed #ccd8d2;border-radius:18px;padding:28px 18px;text-align:center;color:#52615b;display:flex;flex-direction:column;gap:5px;font-family:'Plus Jakarta Sans',Inter,system-ui,sans-serif}
.mtaf-empty-icon{width:44px;height:44px;border-radius:14px;background:#eef7f3;color:#126b4f;display:flex;align-items:center;justify-content:center;margin:0 auto 5px;font-size:22px}
@media(min-width:900px){.mtaf-module-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important}.mtaf-module-card{height:140px!important;min-height:140px!important}}
@media(max-width:899px){.mtaf-module-sheet{max-height:90vh!important;padding:12px 14px calc(18px + env(safe-area-inset-bottom))!important}.mtaf-module-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:11px!important}.mtaf-module-card{min-height:126px!important;height:126px!important;padding:13px 12px 12px!important}.mtaf-module-icon{width:42px!important;height:42px!important;min-width:42px!important;border-radius:14px!important;margin-bottom:9px!important}.mtaf-module-label{font-size:12.5px!important}.mtaf-module-help{font-size:9.8px!important}}
@media(max-width:380px){.mtaf-module-grid{gap:9px!important}.mtaf-module-card{min-height:120px!important;height:120px!important;padding:11px!important;border-radius:19px!important}.mtaf-module-icon{width:38px!important;height:38px!important;min-width:38px!important;border-radius:12px!important;margin-bottom:8px!important}.mtaf-module-label{font-size:11.8px!important}.mtaf-module-help{font-size:9.2px!important}.mtaf-module-arrow{width:26px;height:26px;right:8px;bottom:8px;font-size:17px}}
@media(max-width:350px){.mtaf-module-grid{grid-template-columns:1fr!important}.mtaf-module-card{min-height:96px!important;height:96px!important;display:grid!important;grid-template-columns:42px 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center}.mtaf-module-icon{grid-row:1 / span 2;margin:0!important}.mtaf-module-label{align-self:end}.mtaf-module-help{align-self:start;margin-top:2px!important}}
:root{--mtaf-ink:#0f3d2e;--mtaf-teal:#126b4f;--mtaf-gold:#d4af37;--mtaf-cream:#f6f4ee;--mtaf-text:#1f2937;--mtaf-muted:#4b5563;--mtaf-line:#e5e7eb;--mtaf-soft:#eef7f3}
.mtaf-auth{background:linear-gradient(180deg,#f6f4ee 0%,#fbfaf7 55%,#f6f4ee 100%);min-height:100vh;color:var(--mtaf-text)}
.mtaf-auth .mtaf-brand{background:radial-gradient(circle at 15% 20%,rgba(212,175,55,.10),transparent 32%),linear-gradient(135deg,#0b3428,#0f3d2e 55%,#126b4f);position:relative;overflow:hidden}
.mtaf-auth .mtaf-brand:after{content:"";position:absolute;width:280px;height:280px;border:1px solid rgba(212,175,55,.14);border-radius:50%;right:-90px;top:-120px;box-shadow:0 0 0 35px rgba(212,175,55,.035),0 0 0 70px rgba(212,175,55,.025)}
.mtaf-auth .mtaf-login-wrap{margin-top:-18px;position:relative;z-index:2}
.mtaf-auth .mtaf-login-card{border:1px solid rgba(15,61,46,.10)!important;border-radius:26px!important;box-shadow:0 20px 50px rgba(15,61,46,.12)!important;padding:28px!important}
.mtaf-auth .mtaf-login-title{font-size:1.7rem!important;letter-spacing:-.02em}
.mtaf-auth .mtaf-input{border:1px solid #d9e1dd!important;border-radius:14px!important;background:#fff;min-height:48px;transition:.18s ease}
.mtaf-auth .mtaf-input:focus{border-color:var(--mtaf-teal)!important;box-shadow:0 0 0 3px rgba(18,107,79,.10)!important;outline:none}
.mtaf-auth .mtaf-primary{background:linear-gradient(135deg,#0f5c44,#126b4f)!important;color:#fff!important;border:0!important;border-radius:14px!important;min-height:50px;box-shadow:0 8px 18px rgba(18,107,79,.20);font-size:.95rem}
.mtaf-auth .mtaf-outline{background:#fff!important;color:var(--mtaf-teal)!important;border:1.5px solid var(--mtaf-teal)!important;border-radius:14px!important;min-height:48px}
.mtaf-auth .mtaf-gold-outline{background:#fff!important;color:#a97900!important;border:1.5px solid var(--mtaf-gold)!important;border-radius:14px!important;min-height:52px}
.mtaf-auth .mtaf-checkbox{appearance:none;width:20px;height:20px;border:1.7px solid var(--mtaf-teal);border-radius:6px;background:#fff;display:inline-grid;place-content:center;cursor:pointer}
.mtaf-auth .mtaf-checkbox:checked{background:var(--mtaf-teal)}
.mtaf-auth .mtaf-checkbox:checked:after{content:"✓";color:#fff;font-size:14px;font-weight:800;line-height:1}
.mtaf-auth .mtaf-divider{display:flex;align-items:center;gap:12px;color:#9ca3af;font-size:12px;margin:16px 0}
.mtaf-auth .mtaf-divider:before,.mtaf-auth .mtaf-divider:after{content:"";height:1px;background:#e5e7eb;flex:1}
.mtaf-auth .mtaf-tip{background:linear-gradient(135deg,#eef7f3,#f5faf8);border:1px solid #d7ebe2;border-radius:14px;color:#174c3b}
.mtaf-auth .mtaf-feature-strip{max-width:900px;margin:0 auto;padding:0 20px 24px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;text-align:center}
.mtaf-auth .mtaf-feature{padding:12px 8px;color:var(--mtaf-muted);font-size:12px}.mtaf-auth .mtaf-feature strong{display:block;color:var(--mtaf-ink);font-size:13px;margin-top:5px}
.mtaf-auth .mtaf-offline{background:#fff;border-bottom:1px solid #e5e7eb;box-shadow:0 2px 10px rgba(15,61,46,.04)}
.mtaf-auth .mtaf-offline button{border-radius:999px!important;padding:9px 15px!important;font-weight:700}
@media(max-width:640px){.mtaf-auth .mtaf-login-card{padding:22px!important;border-radius:22px!important}.mtaf-auth .mtaf-brand{padding-top:28px!important;padding-bottom:58px!important}.mtaf-auth .mtaf-login-wrap{margin-top:-28px}.mtaf-auth .mtaf-feature-strip{grid-template-columns:repeat(2,1fr);padding-bottom:18px}.mtaf-auth .mtaf-login-title{font-size:1.5rem!important}.mtaf-auth .mtaf-offline{padding:7px 12px!important}.mtaf-auth .mtaf-offline .mtaf-offline-copy{font-size:11px!important}}
</style>
<style id="mtaf-physical-button-system">
/* MTAF Physical Button Design System */
:root{
  --mtaf-green:#0f3d2e;--mtaf-teal:#126b4f;--mtaf-blue:#2563eb;--mtaf-purple:#6d3bb7;
  --mtaf-gold:#d4af37;--mtaf-orange:#f97316;--mtaf-red:#dc2626;--mtaf-cyan:#1597a6;
  --mtaf-ink:#1f2937;--mtaf-cream:#f6f4ee;
}
button.mtaf-action-btn{
  position:relative!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;
  gap:.5rem!important;min-height:50px!important;padding:.72rem 1.05rem!important;border-radius:15px!important;
  border:1.5px solid var(--mtaf-btn-border,#0f3d2e)!important;
  background:linear-gradient(180deg,var(--mtaf-btn-top,#126b4f) 0%,var(--mtaf-btn,#0f3d2e) 100%)!important;
  color:#fff!important;font-weight:700!important;letter-spacing:.01em!important;
  box-shadow:0 4px 0 var(--mtaf-btn-shadow,#082b20),0 7px 16px rgba(15,61,46,.16),inset 0 1px 0 rgba(255,255,255,.2)!important;
  transform:translateY(0);transition:transform .12s ease,box-shadow .12s ease,filter .12s ease!important;
}
button.mtaf-action-btn:hover{filter:brightness(1.05)!important;transform:translateY(-1px)!important;box-shadow:0 5px 0 var(--mtaf-btn-shadow,#082b20),0 9px 20px rgba(15,61,46,.2),inset 0 1px 0 rgba(255,255,255,.22)!important}
button.mtaf-action-btn:active{transform:translateY(3px)!important;box-shadow:0 1px 0 var(--mtaf-btn-shadow,#082b20),0 3px 8px rgba(15,61,46,.15),inset 0 1px 0 rgba(255,255,255,.16)!important}
button.mtaf-action-btn:disabled{opacity:.55!important;filter:grayscale(.15)!important;transform:none!important;box-shadow:0 2px 0 var(--mtaf-btn-shadow,#082b20)!important}
button.mtaf-action-btn.mtaf-green{--mtaf-btn:#0f3d2e;--mtaf-btn-top:#167a5b;--mtaf-btn-border:#0b5b43;--mtaf-btn-shadow:#082b20}
button.mtaf-action-btn.mtaf-teal{--mtaf-btn:#126b4f;--mtaf-btn-top:#169474;--mtaf-btn-border:#0d7d60;--mtaf-btn-shadow:#084936}
button.mtaf-action-btn.mtaf-blue{--mtaf-btn:#2563eb;--mtaf-btn-top:#3b82f6;--mtaf-btn-border:#1d4ed8;--mtaf-btn-shadow:#173ea7}
button.mtaf-action-btn.mtaf-purple{--mtaf-btn:#6d3bb7;--mtaf-btn-top:#8050d0;--mtaf-btn-border:#5b2fa0;--mtaf-btn-shadow:#3f2173}
button.mtaf-action-btn.mtaf-gold{--mtaf-btn:#b8860b;--mtaf-btn-top:#d4af37;--mtaf-btn-border:#a87908;--mtaf-btn-shadow:#735507}
button.mtaf-action-btn.mtaf-orange{--mtaf-btn:#e85d04;--mtaf-btn-top:#f97316;--mtaf-btn-border:#c94f03;--mtaf-btn-shadow:#873400}
button.mtaf-action-btn.mtaf-red{--mtaf-btn:#dc2626;--mtaf-btn-top:#ef4444;--mtaf-btn-border:#b91c1c;--mtaf-btn-shadow:#7f1d1d}
button.mtaf-action-btn.mtaf-cyan{--mtaf-btn:#0f8d98;--mtaf-btn-top:#16a6b5;--mtaf-btn-border:#087681;--mtaf-btn-shadow:#07545c}
button.mtaf-action-btn.mtaf-neutral{--mtaf-btn:#475569;--mtaf-btn-top:#64748b;--mtaf-btn-border:#334155;--mtaf-btn-shadow:#253246}
/* Outline variant: still feels physical, but uses the category border as the visual anchor. */
button.mtaf-outline-btn{background:linear-gradient(#fff,#f8faf9)!important;color:var(--mtaf-btn,#0f3d2e)!important;box-shadow:0 3px 0 color-mix(in srgb,var(--mtaf-btn,#0f3d2e) 32%,#fff),0 6px 14px rgba(15,61,46,.10),inset 0 1px 0 #fff!important}
button.mtaf-outline-btn:active{box-shadow:0 1px 0 color-mix(in srgb,var(--mtaf-btn,#0f3d2e) 32%,#fff),0 2px 7px rgba(15,61,46,.08)!important}
/* Icon-only controls stay compact; physical treatment without forcing 50px text-button sizing. */
button.mtaf-icon-btn{min-height:40px!important;min-width:40px!important;padding:.5rem!important;border-radius:12px!important}
@media (max-width:640px){
  button.mtaf-action-btn{min-height:54px!important;padding:.78rem 1rem!important;border-radius:16px!important;box-shadow:0 4px 0 var(--mtaf-btn-shadow,#082b20),0 8px 18px rgba(15,61,46,.15),inset 0 1px 0 rgba(255,255,255,.2)!important}
  button.mtaf-icon-btn{min-height:42px!important;min-width:42px!important}
}
</style>
