name: Keep Supabase project alive

on:
  schedule:
    # Runs every 3 days at 03:00 UTC — well under Supabase's 7-day pause window
    - cron: "0 3 */3 * *"
  workflow_dispatch: {}
    # ^ lets you also trigger it manually from the Actions tab any time

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping MTAF Supabase project
        run: |
          curl -sS "https://smrmnsoqohtespbgdjym.supabase.co/rest/v1/" \
            -H "apikey: sb_publishable_4swjn4U3QrFn2_04VieQOw_zTgGkBvM" \
            -o /dev/null -w "Status: %{http_code}\n"
